[workspace]
resolver = "3"
members = [
    "blog-server",
    "blog-client",
    "blog-cli",
    "blog-wasm",
    "blog-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blog-proto = { path = "blog-proto" }
blog-client = { path = "blog-client" }

# gRPC / protobuf
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Logging
env_logger = "0.11"
log = "0.4"

# HTTP / OpenAPI
actix-web = "4"
utoipa = { version = "6", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web", "vendored"] }

# WASM frontend
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
