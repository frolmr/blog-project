[workspace]
resolver = "3"
members = [
    "blog-server",
    "blog-client",
    "blog-cli",
    "blog-wasm",
    "blog-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blog-proto = { path = "blog-proto" }
blog-client = { path = "blog-client" }

# WASM frontend
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
