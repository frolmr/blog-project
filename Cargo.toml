[workspace]
resolver = "3"
members = [
    "blog-server",
    "blog-client",
    "blog-cli",
    "blog-wasm",
    "blog-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blog-proto = { path = "blog-proto" }
blog-client = { path = "blog-client" }

# gRPC / protobuf
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors / config
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"

# Auth
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
argon2 = "0.6"

# HTTP / OpenAPI
actix-web = "4"
actix-cors = "0.7"
actix-web-httpauth = "0.8"
utoipa = { version = "6", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web", "vendored"] }

# Time / serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM frontend
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
